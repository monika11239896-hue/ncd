<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topology Details</title>

  <!-- Bootstrap -->
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
   <link href="assets/css/styles.css" rel="stylesheet">

</head>

<body class="app-body">

  <!-- Top strip -->
  <div class="top-strip">
    <a href="/" class="text-decoration-none fw-bold">Home</a>
  </div>

  <div class="container-fluid" style="width: 100%;">
    <div class="row justify-content-center">

      <main class="content-wrap col-12">
        <div class="content-inner p-4">

          <!-- Meta header -->
          <header style="margin:10px 7%; padding: 20px ; background-color: white;">
            <div class="meta-block">
              <div><strong>Topology Name:</strong> <span data-topology-name>—</span></div>
              <div><strong>ID:</strong> <span data-topology-id>--</span></div>
              <div><strong>Version:</strong> <span data-topology-version>—</span></div>
              <div><strong>Author Name:</strong> <span data-topology-author>—</span></div>
            </div>
            <div class="text-muted small" id="metaDate">--</div>
          </header>

          <!-- Main content row -->
          <div class="main-content-row">

            <!-- CAN Channel -->
            <div class="can_channel" >
              <button class="btn btn-outline-secondary btn-sm mb-3" data-bs-toggle="modal" data-bs-target="#canChannelModal">
                Create a New CAN Channel
              </button>

              <!-- CAN Channels List -->
              <div class="mt-1" style="max-height: 60vh; overflow-y: auto;">
                <h6 class="fw-bold">CAN Channels</h6>
                <div id="canChannelList" class="mt-2"></div>
              </div>
              
              
            </div>

            <!-- Right Panel -->
            <aside class="right-panel">
              <div class="d-flex gap-2 ">
                <button class="btn btn-outline-secondary btn-sm" id="addMessage">
                  + Add Message
                </button>

                <a href="addSig.html" class="btn btn-outline-secondary btn-sm">
                  + Add Signal
                </a>
              </div>

                <button class="btn btn-outline-secondary btn-sm mb-3" id="addEcuBtn" data-bs-toggle="modal"
                    data-bs-target="#addEcuModal">
                    Add New ECU
                </button>

                 <!-- ECU expandable list -->
                <div id="ecuList" class="small" style="max-height: 55vh; overflow-y: auto;"></div>
            </aside>

          </div>
        </div>
      </main>

    </div>
  </div>

   <div class="modal fade" id="canChannelModal" tabindex="-1" aria-labelledby="canChannelModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="canChannelModalLabel">Create New CAN Channel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form id="canChannelForm">
            <!-- CAN Channel Name -->
            <div class="mb-3">
              <label for="canName" class="form-label">CAN Channel Name</label>
              <input type="text" class="form-control" id="canName" placeholder="Enter CAN Channel Name" required>
            </div>
            <!-- Search -->
            <input
              type="text"
              id="ecuSearch"
              class="form-control form-control-sm mb-2"
              placeholder="Search ECU..."
            />
            <!-- Select ECUs -->
            
          <div class="mb-3">
            <label class="form-label">Select ECUs</label>
            
            <div
              id="ecuCheckboxList"
              class="border rounded p-2"
              style="height: 180px; overflow-y: auto;"
            ></div>
          </div>
          </form>
        </div>

       <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="canChannelForm" class="btn btn-primary btn-sm">Create Channel</button>
      </div>
      </div>
    </div>
  </div>


<div class="modal fade" id="addEcuModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Create New ECU</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- ECU Name -->
        <div class="mb-3">
          <label class="form-label">ECU Name</label>
          <input type="text"
                 id="ecuNameInput"
                 class="form-control"
                 placeholder="ecu_4">
        </div>

       
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
          Cancel
        </button>
        <button class="btn btn-primary btn-sm" id="saveEcuBtn">
          Create ECU
        </button>
      </div>

    </div>
  </div>
</div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
