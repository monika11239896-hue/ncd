<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File List</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
    body { font-family: Arial; background:#f4f4f4; }
.container { background:#fff; padding:2px; border-radius:8px; margin-bottom:2px }
    .signal { border:1px solid #ddd; padding:15px; border-radius:6px; margin-top:15px }
table { width:100%; border-collapse:collapse }
td { padding:6px }
input, select { width:95%; padding:6px }
button { padding:8px 14px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer }
button:hover { background:#0056d0 }
.inline-error { color:red; font-size:13px; display:none }
#messageSelect{
  margin: 15px;
}
.body-container{
  padding: 10px 35px ;
}
#popupModal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.5);
  display:none; justify-content:center; align-items:center;
}
  </style>
</head>
<body class="app-body">

  <!-- Top dark strip -->
  <div class="top-strip">
    <div class="top-strip d-flex align-items-center px-3 ">
        <div class="px-3 py-3">
          
            <a href="/" class="text-decoration-none fw-bold">Home</a>
            
        </div>
    </div>

  </div>

  <div class="container mt-4" style="max-width: 900px;">
  <div class="card shadow-sm">
    <div class="card-body">

      <h5 class="mb-3">Add Messages</h5>

      <form id="messagesForm">

        <div id="messagesContainer"></div>

        <button type="button"
                class="btn btn-outline-secondary btn-sm mb-3"
                id="addMessageBtn">
          + Add Message
        </button>

        <div class="d-flex justify-content-end gap-2">
          
          <button type="submit" class="btn btn-primary btn-sm">
            Save Messages
          </button>
        </div>

      </form>

    </div>
  </div>
</div>



  <!-- Bootstrap JS -->
   <script src="assets/js/app.js"></script>

  <script src="assets/js/add-message.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
