<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>Add Signal Tool</title>
 <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
  body { font-family: Arial; background:#f4f4f4; }
  .container { background:#fff; padding:2px; border-radius:8px; margin-bottom:2px }
  .signal { border:1px solid #ddd; padding:15px; border-radius:6px; margin-top:15px }
  table { width:100%; border-collapse:collapse }
  td { padding:6px }
  input, select { width:95%; padding:6px }
  button { padding:8px 14px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer }
  button:hover { background:#0056d0 }
  .inline-error { color:red; font-size:13px; display:none }
  #messageSelect{
    margin: 15px;
  }
  .body-container{
    padding: 10px 35px ;
  }
#popupModal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.5);
  display:none; justify-content:center; align-items:center;
}
</style>
<link href="assets/css/styles.css" rel="stylesheet">
</head>

<body>
 <!-- Top dark strip -->
  <div class="top-strip">
    <div class="top-strip d-flex align-items-center px-3 ">
        <div class="px-3 py-3">
          <a href="/" class="text-decoration-none fw-bold">Home</a>
        </div>
    </div>

  </div>
<div class="container body-container">
<h2>Add Signals</h2>
<form id="signalsForm" class="p-3">

  <!-- CAN CHANNEL -->
  <div class="mb-3">
    <label class="form-label">CAN Channel *</label>
    <select class="form-select" id="canChannelSelect" required>
      <option value="">Select CAN Channel</option>
    </select>
  </div>

  <!-- MESSAGE -->
  <div class="mb-3">
    <label class="form-label">Message *</label>
    <select class="form-select" id="messageSelect" required>
      <option value="">Select Message</option>
    </select>
  </div>

  <!-- SIGNALS -->
  <div id="signalsContainer"></div>

  <button type="button" class="btn btn-outline-secondary btn-sm"
          id="addSignalBtn">
    + Add Signal
  </button>

  <hr>

  <button type="submit" class="btn btn-primary btn-sm">
    Save Signals
  </button>
</form>

</div>
<script src="assets/js/addSig.js"></script>
</body>
</html>
