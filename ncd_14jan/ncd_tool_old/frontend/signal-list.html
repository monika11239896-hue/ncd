<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signal List</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/message-list.css">
</head>
<body>

<div class="container-fluid px-4 py-4">

  <!-- Header -->
  <div class="page-header mb-4">
    <div>
      <h4 class="page-title" id="messageTitle">Signals</h4>
      <p class="page-subtitle" id="messageDetails"></p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Add Signal
    </button>
  </div>

  <!-- Search -->
  <div class="mb-3">
    <input
      type="text"
      id="signalSearch"
      class="form-control"
      placeholder="Search by signal name, receiver ECU"
    />
  </div>

  <!-- Table -->
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Signal Name</th>

            <!-- Receiver ECU Filter -->
            <th>
              Receiver ECU
              <div class="dropdown d-inline">
                <i class="bi bi-funnel filter-icon" data-bs-toggle="dropdown"></i>
                <div class="dropdown-menu filter-dropdown p-2">
                  <input
                    type="text"
                    class="form-control form-control-sm mb-2"
                    placeholder="Search ECU"
                    onkeyup="filterDropdown(this)"
                  />
                  <div id="receiverEcuList" class="filter-list"></div>
                </div>
              </div>
            </th>

            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="signalTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/signal-list.js"></script>
</body>
</html>
