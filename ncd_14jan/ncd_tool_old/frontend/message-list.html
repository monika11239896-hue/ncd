<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Message List</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/message-list.css">
    

</head>
<body>


<div class="container-fluid px-4 py-4">

  <!-- Page Header -->
  <div class="page-header mb-4">
    <div>
      <h4 class="page-title">Message List</h4>
      <p class="page-subtitle">List of all configured CAN messages</p>
    </div>
    <button class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Add Message
    </button>
  </div>

  <!-- Filters -->
  <div class="mb-3">
    <input
      type="text"
      id="globalSearch"
      class="form-control"
      placeholder="Search messages by ID, name, ECU, channel"
    />
  </div>

  <!-- Table -->
<div class="card table-card">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Message Name</th>

          <!-- Sender ECU Filter -->
          <th>
            Sender ECU
            <div class="dropdown d-inline">
              <i class="bi bi-funnel filter-icon" data-bs-toggle="dropdown"></i>
              <div class="dropdown-menu filter-dropdown p-2">
                <input
                  type="text"
                  class="form-control form-control-sm mb-2"
                  placeholder="Search ECU"
                  onkeyup="filterDropdown(this, 'ecu')"
                />
                <div id="ecuFilterList" class="filter-list"></div>
              </div>
            </div>
          </th>

          <!-- Channel Filter -->
          <th>
            CAN Channel
            <div class="dropdown d-inline">
              <i class="bi bi-funnel filter-icon" data-bs-toggle="dropdown"></i>
              <div class="dropdown-menu filter-dropdown p-2">
                <input
                  type="text"
                  class="form-control form-control-sm mb-2"
                  placeholder="Search Channel"
                  onkeyup="filterDropdown(this, 'channel')"
                />
                <div id="channelFilterList" class="filter-list"></div>
              </div>
            </div>
          </th>

          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody id="messageTableBody"></tbody>
    </table>
  </div>
</div>

  <!-- Footer -->
  <div class="d-flex justify-content-between align-items-center mt-3">
    <span id="tableInfo" class="table-info"></span>
    <ul class="pagination mb-0" id="pagination"></ul>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/message-list.js"></script>
<script src="assets/js/message-list.js"></script>
 <script src="assets/js/navbar.js"></script>
</body>
</html>
