<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>Add Signal Tool</title>
 <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
  body { font-family: Arial; background:#f4f4f4; }
  .container { background:#fff; padding:2px; border-radius:8px; margin-bottom:2px }
  .signal { border:1px solid #ddd; padding:15px; border-radius:6px; margin-top:15px }
  table { width:100%; border-collapse:collapse }
  td { padding:6px }
  input, select { width:95%; padding:6px }
  button { padding:8px 14px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer }
  button:hover { background:#0056d0 }
  .inline-error { color:red; font-size:13px; display:none }
  #messageSelect{
    margin: 15px;
  }
  .body-container{
    padding: 10px 35px ;
  }
#popupModal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.5);
  display:none; justify-content:center; align-items:center;
}
</style>
<link href="assets/css/add_msg.css" rel="stylesheet">

</head>

<body>
 <!-- Top dark strip -->

  
  <div class="container-fluid" style="width: 100%; ">
  
  <div class="d-flex justify-content-between align-items-center mt-2">
            <!-- Back button -->
          <button type="button"
                  class="btn btn-outline-secondary"
                  id="backBtn">
            ← Back
          </button>

          <!-- Create DBC button -->
          <button type="button"
                  class="btn btn-primary"
                  id="createDbcBtn">
            Message List
          </button>
        </div>
        </div>
      </div>
<div class="container body-container mt-4">

<h2>Add Signals</h2>
<form id="signalsForm" class="p-3">

  <!-- SIGNALS -->
  <div id="signalsContainer"></div>

  <button type="button" class="btn btn-outline-secondary btn-sm mb-2"
          id="addSignalBtn">
    + Add Signal
  </button>


  <div class="sticky-footer">
  <button type="submit" class="btn btn-success btn-sm">
    Save Signals
  </button>
</div>
</form>

</div>
<script type="module" src="assets/js/addSig.js"></script>
<script src="assets/js/navbar.js"></script>
</body>
</html>
